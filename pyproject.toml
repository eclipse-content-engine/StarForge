[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "starforge"
version = "0.2.0"
description = "Desktop and command-line tools for safe Starfield system authoring"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8"]

[project.urls]
Homepage = "https://github.com/eclipse-content-engine/StarForge"
Issues = "https://github.com/eclipse-content-engine/StarForge/issues"
Repository = "https://github.com/eclipse-content-engine/StarForge.git"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-qt>=4.4",
    "ruff>=0.9",
]

[project.gui-scripts]
starforge-gui = "starforge.ui.app:run"

[project.scripts]
starforge = "starforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["private_integration: requires locally installed proprietary game data"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/starforge"]
check_untyped_defs = true
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
